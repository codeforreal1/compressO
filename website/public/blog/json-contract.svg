<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="CompressO JSON Contract powering the UI, CLI, and MCP tools" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090807"/><stop offset="1" stop-color="#030303"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1917"/><stop offset="1" stop-color="#11100f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55"><stop offset="0" stop-color="#ff8400" stop-opacity="0.28"/><stop offset="1" stop-color="#ff8400" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="640" cy="360" rx="540" ry="300" fill="url(#glow)"/>

  <rect x="76" y="88" width="540" height="544" rx="26" fill="url(#panel)" stroke="#ff8400" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="108" y="120" width="212" height="32" rx="16" fill="#ff8400" fill-opacity="0.16"/>
  <text x="214" y="141" font-size="14" font-weight="700" fill="#ffa04a" text-anchor="middle">video.contract.json</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17.5" fill="#e5e1db">
    <text x="108" y="192">{</text>
    <text x="132" y="226"><tspan fill="#ffa04a">"version"</tspan>: 1,</text>
    <text x="132" y="260"><tspan fill="#ffa04a">"mediaType"</tspan>: "video",</text>
    <text x="132" y="294"><tspan fill="#ffa04a">"name"</tspan>: "Web 1080p",</text>
    <text x="132" y="328"><tspan fill="#ffa04a">"settings"</tspan>: {</text>
    <text x="156" y="362"><tspan fill="#ffa04a">"format"</tspan>: "mp4",</text>
    <text x="156" y="396"><tspan fill="#ffa04a">"compression"</tspan>: { <tspan fill="#ffa04a">"mode"</tspan>: "quality" },</text>
    <text x="156" y="430"><tspan fill="#ffa04a">"video"</tspan>: { <tspan fill="#ffa04a">"codec"</tspan>: "h264" },</text>
    <text x="156" y="464"><tspan fill="#ffa04a">"resolution"</tspan>: { <tspan fill="#ffa04a">"longerSidePx"</tspan>: 1080 },</text>
    <text x="156" y="498" font-size="13" fill="#8a847e">// one-shot: metadata.set, thumbnail, subtitles</text>
    <text x="132" y="532">},</text>
    <text x="132" y="566"><tspan fill="#ffa04a">"output"</tspan>: { <tspan fill="#ffa04a">"saveTo"</tspan>: "sameFolder" }</text>
    <text x="108" y="600">}</text>
  </g>

  <path d="M626 220 L706 184" stroke="#ff8400" stroke-width="2.5" stroke-opacity="0.7" fill="none"/>
  <path d="M626 360 L706 360" stroke="#ff8400" stroke-width="2.5" stroke-opacity="0.7" fill="none"/>
  <path d="M626 500 L706 536" stroke="#ff8400" stroke-width="2.5" stroke-opacity="0.7" fill="none"/>

  <rect x="716" y="106" width="488" height="148" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="752" y="154" font-size="23" font-weight="700" fill="#f5f3ef">CompressO UI</text>
  <text x="752" y="188" font-size="17" fill="#a8a29c">Export settings or presets as .json, paste to import</text>
  <text x="752" y="218" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffa04a">Export JSON Contract · New from contract</text>

  <rect x="716" y="286" width="488" height="148" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="752" y="334" font-size="23" font-weight="700" fill="#f5f3ef">Terminal CLI</text>
  <text x="752" y="368" font-size="17" fill="#a8a29c">Validate schemas, update presets, run one-shot files</text>
  <text x="752" y="398" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffa04a">compresso clip.mov --contract=video.contract.json</text>

  <rect x="716" y="466" width="488" height="148" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="752" y="514" font-size="23" font-weight="700" fill="#f5f3ef">AI Agents (MCP)</text>
  <text x="752" y="548" font-size="17" fill="#a8a29c">Read schema capabilities, inspect media, run workflows</text>
  <text x="752" y="578" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#ffa04a">get_contract_schema · create_preset · compress</text>
</svg>
