<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Stream-copied clips split from a single compressed video" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
