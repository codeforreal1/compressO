[package]
name = "compresso-cli"
version = "1.0.0"
description = "The command line tool of CompressO: compresses media with the app's presets."
authors = ["Code For Real"]
license = "AGPL-3.0-only"
repository = "https://github.com/codeforreal1/compressO"
edition = "2021"

[[bin]]
name = "compresso-cli"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.34.0", features = [
    "rt",
    "macros",
    "net",
    "io-util",
    "io-std",
    "sync",
    "time",
    "signal",
] }

[build-dependencies]
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }
