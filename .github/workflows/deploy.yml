name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      # Enable Pages once in Settings > Pages > Source > GitHub Actions.
      - name: Check GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.0.0
      - name: Install website dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Build website
        working-directory: website
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm exec astro build --site "$PAGES_ORIGIN" --base "${PAGES_BASE_PATH:-/}"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
