# Builds CompressO for Apple Silicon & Intel Macs, Windows & Linux at once, & uploads the installers
# to a draft release ("Test build #N"), to download & test. Drafts are only visible to the
# repository's maintainers & never the latest release, which the app's updater reads. Delete the
# draft when done. Run it from the Actions tab (Test build -> Run workflow, on any branch).
name: Test build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    name: Create the draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: test-build-${{ github.run_number }}
          NAME: "Test build #${{ github.run_number }} (${{ github.ref_name }})"
        run: |
          release_id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$NAME" \
            -F draft=true -F prerelease=true \
            -f body="Test build of \`$GITHUB_REF_NAME\` ($GITHUB_SHA), not signed. Delete this draft when done." \
            --jq .id)
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          # Built on Apple Silicon too (see `swift_build_command` in src-tauri/build.rs)
          - name: macOS, Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu, so the AppImage & .deb run on older Linux too
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libdbus-1-dev patchelf

      # The Swift code is built with `swift build --build-system native` (Swift 6.2 / Xcode 26 or newer)
      - name: Use the newest Xcode
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          swift --version

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # `pnpm install` runs `fnm use` first (pnpm:devPreinstall); Node is already set up here
      - name: Stand in for fnm
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fnm"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/fnm/fnm"
          chmod +x "$RUNNER_TEMP/fnm/fnm"
          printf '@exit /b 0\r\n' > "$RUNNER_TEMP/fnm/fnm.cmd"
          echo "$RUNNER_TEMP/fnm" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      # Without the updater's files, which need its private key (see tauri.test-build.conf.json)
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.test-build.conf.json
          includeUpdaterJson: false
